# CodeQL analysis configuration for NEAT-AI-Backpropagation.
#
# `neat-core` used to be a path dependency, so CI checked NEAT-AI-core out into
# the workspace and CodeQL's Rust extraction (`build-mode: none`) — which
# resolves the workspace from source — extracted that sibling as well, filing
# its findings against *this* repository: two `rust/cleartext-logging` alerts on
# NEAT-AI-core's own test suite (`creature_validate_conformance.rs`) reached
# this repo's Security tab, where nobody can fix them.
#
# The dependency is a git-tag pin now (Issue #153), so cargo resolves it under
# `~/.cargo/git` and nothing checks NEAT-AI-core out beside this repository. The
# ignore is kept as a standing guard: were a sibling checkout ever reintroduced,
# its alerts would stay in the repository that owns that code.
name: NEAT-AI-Backpropagation

paths-ignore:
  - NEAT-AI-core/**

# Rules that misfire on neural-network code, excluded family-wide
# (stSoftwareAU/VibeCoder#2716): `uuid` reads as private data to CodeQL's name
# heuristic, `Math.random()` for weights and biases is not a security context,
# and `derive_seed(…, salt)` mixes RNG seeds rather than hashing secrets.
query-filters:
  - exclude:
      id: rust/cleartext-logging
  - exclude:
      id: js/insecure-randomness
  - exclude:
      id: rust/hard-coded-cryptographic-value
