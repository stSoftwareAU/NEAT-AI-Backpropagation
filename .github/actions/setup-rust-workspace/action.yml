name: Set up the Rust workspace
description: >-
  Install the pinned Rust toolchain every Rust job needs, so the
  `dtolnay/rust-toolchain` pin is edited in one place instead of five
  (Issue #126).

  `neat-core` is a git dependency pinned to a NEAT-AI-core release tag
  (Issue #153), so cargo fetches it itself: no sibling checkout and no symlink
  are needed for the workspace to build.

  The calling workflow keeps its own `actions/checkout` step: GitHub has to
  find this file in the workspace before it can run any step in it, so the
  repository's own checkout cannot move inside a local composite action.

inputs:
  components:
    description: >-
      Comma-separated rustup components to install alongside the toolchain
      (for example "rustfmt, clippy"). Empty installs the toolchain alone.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
      with:
        components: ${{ inputs.components }}
