name: Set up the Rust workspace
description: >-
  Check out stSoftwareAU/NEAT-AI-core, symlink it to the sibling path Cargo
  expects (so the `backpropagation/Cargo.toml` `../../NEAT-AI-core/neat-core`
  path dependency resolves on the runner), and install the pinned Rust
  toolchain. Single source of truth for the preamble every Rust job repeats,
  so the NEAT-AI-core ref and the `dtolnay/rust-toolchain` pin are edited in
  one place instead of five (Issue #126).

  The calling workflow keeps its own `actions/checkout` step: GitHub has to
  find this file in the workspace before it can run any step in it, so the
  repository's own checkout cannot move inside a local composite action.

inputs:
  neat-core-ref:
    description: Git ref of stSoftwareAU/NEAT-AI-core to check out.
    required: false
    default: Develop
  components:
    description: >-
      Comma-separated rustup components to install alongside the toolchain
      (for example "rustfmt, clippy"). Empty installs the toolchain alone.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout NEAT-AI-core (path dependency for neat-core)
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      with:
        repository: stSoftwareAU/NEAT-AI-core
        ref: ${{ inputs.neat-core-ref }}
        path: NEAT-AI-core
        persist-credentials: false

    - name: Link NEAT-AI-core sibling path expected by Cargo
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
          ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
        fi

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
      with:
        components: ${{ inputs.components }}
