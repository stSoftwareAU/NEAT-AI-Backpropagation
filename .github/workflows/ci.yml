# Quality bar aligned with NEAT-AI-Lamarck (fmt, clippy, tests, security, spell & shell checks).
#
# Job dependency graph:
#
#   validation ──┬── quality ─────────────┐
#                │                         │
#                └── security ─────────────┤
#                                          ├──► ci-required  (aggregator)
#   shell-checks ──────────────────────────┤
#   spell-check ───────────────────────────┤
#   workflow-lint ─────────────────────────┘
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      - "milestone/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    name: Quality Checks
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the Rust workspace (NEAT-AI-core sibling + toolchain)
        uses: ./.github/actions/setup-rust-workspace
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --all-features --verbose -- --test-threads=2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  security:
    needs: [validation]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    with:
      # Enabled deliberately (Issue #28): audit-check scans the resolved graph,
      # dependency review is the only gate on the crates *this PR* adds.
      # scripts/check-dependency-review.sh fails if it is switched off again.
      include-dependency-review: true

  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Set up the Rust workspace (NEAT-AI-core sibling + toolchain)
        uses: ./.github/actions/setup-rust-workspace

      - name: Check for required files
        run: |
          set -euo pipefail
          required_files=(
            "Cargo.toml"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "quality.sh"
            "deny.toml"
            "rust-toolchain.toml"
            "backpropagation/src/main.rs"
            ".github/CODEOWNERS"
            ".github/workflows/codeql.yml"
            ".github/workflows/gitleaks.yml"
            ".github/workflows/semgrep.yml"
            "SECURITY.md"
            "neat-core.expected-version"
            "renovate.json"
          )
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "Missing required files: ${missing_files[*]}"
            exit 1
          fi

      - name: Validate Cargo workspace
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Gate on unhandled breaking neat-core bump
        run: ./scripts/check-neat-core-version.sh

      - name: Validate CodeQL code-scanning workflow
        run: |
          set -euo pipefail
          ./scripts/test-check-codeql-workflow.sh
          ./scripts/check-codeql-workflow.sh

      - name: Validate the actionlint workflow-lint gate
        run: |
          set -euo pipefail
          ./scripts/test-check-actionlint-gate.sh
          ./scripts/check-actionlint-gate.sh

      - name: Validate the auto version bump covers every build-affecting path
        run: |
          set -euo pipefail
          ./scripts/test-bump-backpropagation-version.sh
          ./scripts/test-check-version-increment-workflow.sh
          ./scripts/check-version-increment-workflow.sh

      - name: Validate Gitleaks secrets-detection workflow
        run: |
          set -euo pipefail
          ./scripts/test-check-gitleaks-workflow.sh
          ./scripts/check-gitleaks-workflow.sh

      - name: Validate Semgrep SAST scanning workflow
        run: |
          set -euo pipefail
          ./scripts/test-check-semgrep-workflow.sh
          ./scripts/check-semgrep-workflow.sh

      - name: Validate Markdown Lint workflow
        run: |
          set -euo pipefail
          ./scripts/test-check-markdown-lint-workflow.sh
          ./scripts/check-markdown-lint-workflow.sh

      - name: Validate confirmed cross-repo defects stay durably recorded
        run: |
          set -euo pipefail
          ./scripts/test-check-cross-repo-defect-record.sh
          ./scripts/check-cross-repo-defect-record.sh

      - name: Validate Renovate dependency-update config
        run: |
          set -euo pipefail
          ./scripts/test-check-renovate-config.sh
          ./scripts/check-renovate-config.sh

      - name: Validate dependency review is enabled on pull requests
        run: |
          set -euo pipefail
          ./scripts/test-check-dependency-review.sh
          ./scripts/check-dependency-review.sh

      - name: Validate default-branch protection policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/test-check-branch-protection.sh
          # Advisory: only a repository administrator can repair ruleset drift,
          # so report it as an annotation rather than blocking every merge.
          ./scripts/check-branch-protection.sh \
            || echo "::warning::Develop branch protection does not satisfy the policy in CONTRIBUTING.md — a repository administrator must apply it (Issue #21)"

  shell-checks:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Check bash script syntax
        run: |
          set -euo pipefail
          EXIT_CODE=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK $script"
            else
              echo "FAIL $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit $EXIT_CODE

      - name: Run ShellCheck
        env:
          SHELLCHECK_OPTS: -s bash
        run: |
          set -euo pipefail
          shellcheck --version
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install codespell
        run: pip install --user codespell

      - name: Run codespell preflight
        run: ./scripts/spell-check.sh

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned release + checksum: a hijacked actionlint release cannot land
      # silently, and a tampered download fails the job instead of skipping it.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$tarball" actionlint

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint -version
          # No file arguments: actionlint discovers .github/workflows itself and
          # pipes every run: block through the runner's shellcheck.
          actionlint -color

  ci-required:
    name: CI Required Checks
    needs: [validation, quality, security, shell-checks, spell-check, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gating jobs succeeded
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
          SPELL_CHECK_RESULT: ${{ needs.spell-check.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK   $name: $result"
            else
              echo "FAIL $name: $result" >&2
              fail=1
            fi
          }
          check "validation"   "$VALIDATION_RESULT"
          check "quality"      "$QUALITY_RESULT"
          check "security"     "$SECURITY_RESULT"
          check "shell-checks" "$SHELL_CHECKS_RESULT"
          check "spell-check"  "$SPELL_CHECK_RESULT"
          check "workflow-lint" "$WORKFLOW_LINT_RESULT"
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more gating jobs did not succeed — blocking merge." >&2
            exit 1
          fi
          echo "All gating jobs succeeded — safe to merge."
