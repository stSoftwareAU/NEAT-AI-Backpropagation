# Keep the copied NEAT-AI-core helpers current, and keep the `neat-core`
# release pin moving (issue #152 / #153, core #680 / #681).
#
# `scripts/runlib.sh` and `scripts/family-pins.sh` each have one home — the
# same path on NEAT-AI-core `Develop`. Behaviour changes to either are made in
# NEAT-AI-core and re-copied outward, never edited downstream. This job is the
# copy: on every PR it fetches both canonical copies and, when the branch's
# copy differs, refreshes it. A fetch that fails — an unreachable raw URL, an
# HTTP error, an empty or non-script payload — fails the job rather than
# leaving a stale copy looking synced.
#
# It then runs `scripts/family-pins.sh`, which rewrites the `neat-core` git
# tag in `backpropagation/Cargo.toml` to NEAT-AI-core's newest release and
# re-locks `Cargo.lock`. That is the only way the pin moves: through this
# repository's own PR, refreshed automatically on every one of them. A pin that
# cannot be resolved exits the job non-zero rather than leaving it stale.
#
# Refreshing a script is not a source change — neither copied script is in
# scripts/build-affecting-paths.sh — but a moved pin is: `Cargo.lock` and
# `backpropagation/Cargo.toml` are both build-affecting, so the push below
# re-triggers `version-increment.yml`, which bumps the patch version. The pin
# therefore never moves at an unchanged crate version.
#
# The refreshed copies are committed and pushed by
# `.github/actions/push-branch-changes`, the one copy of the push recipe this
# repository's three pushing workflows share (App token -> ACTIONS_PUSH ->
# GITHUB_TOKEN, issue #164). It rebases first, so a PR branch that moved while
# this job ran is not rejected as non-fast-forward.
name: Family Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      - "milestone/**"

permissions:
  contents: read

concurrency:
  group: family-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  family-sync:
    name: Sync NEAT-AI-core helpers and the neat-core pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks get no push credential, so the sync would fail on every fork PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    env:
      CANONICAL_RUNLIB_URL: https://raw.githubusercontent.com/stSoftwareAU/NEAT-AI-core/Develop/scripts/runlib.sh
      CANONICAL_FAMILY_PINS_URL: https://raw.githubusercontent.com/stSoftwareAU/NEAT-AI-core/Develop/scripts/family-pins.sh

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # family-pins.sh runs `cargo update`, so the pinned toolchain is needed.
      - name: Set up the Rust workspace (pinned toolchain)
        uses: ./.github/actions/setup-rust-workspace

      - name: Fetch the canonical helpers from NEAT-AI-core Develop
        run: |
          set -euo pipefail
          fetched="$(mktemp)"
          trap 'rm -f "$fetched"' EXIT
          sync_one() {
            local url="$1" target="$2"
            # --fail makes any HTTP error a non-zero exit: an unreachable
            # canonical copy fails this job instead of passing on a stale one.
            curl --fail --silent --show-error --location --retry 3 \
              --output "$fetched" "$url"
            if [[ ! -s "$fetched" ]]; then
              echo "::error::fetched an empty $target from $url"
              exit 1
            fi
            if ! head -n 1 "$fetched" | grep -q '^#!'; then
              echo "::error::$url did not answer with a shell script"
              exit 1
            fi
            if cmp -s "$fetched" "$target"; then
              echo "$target is byte-identical to NEAT-AI-core Develop"
            else
              cp "$fetched" "$target"
              chmod +x "$target"
              echo "$target refreshed from NEAT-AI-core Develop"
            fi
          }
          sync_one "$CANONICAL_RUNLIB_URL" scripts/runlib.sh
          sync_one "$CANONICAL_FAMILY_PINS_URL" scripts/family-pins.sh

      - name: Move the neat-core pin to the latest NEAT-AI-core release
        run: |
          set -euo pipefail
          ./scripts/family-pins.sh

      - name: Detect a refreshed helper or a moved pin
        id: sync
        run: |
          set -euo pipefail
          CHANGED_PATHS=(
            scripts/runlib.sh
            scripts/family-pins.sh
            backpropagation/Cargo.toml
            Cargo.lock
          )
          if [[ -n "$(git status --porcelain -- "${CHANGED_PATHS[@]}")" ]]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "nothing to sync — helpers current and the pin is on the latest release"
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

      # Mint, commit and push all live in the shared composite action, so the
      # push credential — and the rebase that keeps a branch which moved
      # meanwhile pushable — have one home across the three pushing workflows
      # (Issue #164). A rebase conflict here means the branch edits the copied
      # helpers too: re-copy them from NEAT-AI-core Develop by hand.
      - name: Commit and push the refreshed copies and pin
        if: steps.sync.outputs.changed == 'true'
        uses: ./.github/actions/push-branch-changes
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit-message: "chore: sync NEAT-AI-core helpers and move the neat-core pin"
          paths: scripts/runlib.sh scripts/family-pins.sh backpropagation/Cargo.toml Cargo.lock
          app-client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
