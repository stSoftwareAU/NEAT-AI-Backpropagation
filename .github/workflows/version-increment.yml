# Auto-increment backpropagation/Cargo.toml patch when a build-affecting path
# changes on a PR (shared fleet version-increment job / runlib.sh contract).
#
# Remotes rebuild neat_ai_backpropagation when the crate version changes — and
# only then. Every path that alters the artefact (sources, both manifests, the
# lockfile, cargo/toolchain config, the FFI header) is therefore in the filter
# below and in scripts/build-affecting-paths.sh (issue #95). This job bumps the
# patch on such PRs if the branch has not already bumped *ahead* of Develop.
# A head version strictly behind Develop fails the bump script (exit 2) rather
# than looking like a deliberate bump — silent downgrades break trainDir / FFI
# consumers (issue #87). Re-running after a valid bump is a no-op (idempotent).
#
# The bump is committed and pushed by `.github/actions/push-branch-changes`,
# the one copy of the push recipe this repository's three pushing workflows
# share (App token → ACTIONS_PUSH → GITHUB_TOKEN, issue #164).
name: Version Increment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
    paths:
      # Build-affecting paths — keep in step with
      # scripts/build-affecting-paths.sh (check-version-increment-workflow.sh
      # fails the PR when one is missing).
      - "backpropagation/src/**"
      - "backpropagation/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "include/**"
      # The bump machinery itself.
      - "scripts/build-affecting-paths.sh"
      - "scripts/bump-backpropagation-version.sh"
      - "scripts/check-crate-version-no-downgrade.sh"
      - "scripts/crate-version.sh"
      - "scripts/runlib.sh"
      - ".github/workflows/version-increment.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-increment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-increment:
    name: Auto-increment Versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: |
          set -euo pipefail
          git fetch origin Develop:Develop || git fetch origin Develop || true

      - name: Bump backpropagation patch version when a build-affecting path changed
        id: bump
        run: |
          set -euo pipefail
          if ./scripts/bump-backpropagation-version.sh --base-ref origin/Develop; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              echo "changed=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi

      # Mint, commit and push all live in the shared composite action, so the
      # push credential has one home across the three pushing workflows
      # (Issue #164).
      - name: Commit and push version bump
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/push-branch-changes
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit-message: "chore: auto-increment versions for changed projects"
          paths: backpropagation/Cargo.toml Cargo.lock
          app-client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
