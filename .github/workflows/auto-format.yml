# Auto-format / PR housekeeping job.
#
# Runs on pull requests targeting Develop or a `milestone/**` branch (milestone
# sub-issue PRs merge into the shared milestone branch, so they need the same
# gate — Issue #27). Applies `cargo fmt --all` and
# refreshes `Cargo.lock` against the checked-out NEAT-AI-core path dependency
# (`cargo update -p neat-core`). If the working tree changes, the fix is
# committed and pushed back. Re-running on a clean branch is a no-op.
#
# Deliberately does NOT bump `neat-core.expected-version` — the breaking-bump
# gate stays a human acknowledgement.
name: Auto Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      - "milestone/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PUSH_APP_CONFIGURED: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID != '' && secrets.ACTIONS_PUSH_APP_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up NEAT-AI-core sibling (path dependency for neat-core)
        uses: ./.github/actions/setup-neat-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
        with:
          components: rustfmt

      - name: Apply cargo fmt
        run: |
          set -euo pipefail
          cargo fmt --all

      - name: Sync Cargo.lock to latest neat-core
        run: |
          set -euo pipefail
          cargo update -p neat-core

      - name: Detect formatting / lockfile changes
        id: detect
        run: |
          set -euo pipefail
          if ./scripts/auto-format.sh --check-changes; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
          {
            echo "commit_message<<AUTO_FORMAT_COMMIT_MESSAGE_EOF"
            ./scripts/auto-format.sh --commit-message
            echo "AUTO_FORMAT_COMMIT_MESSAGE_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Mint repo-scoped push token
        id: push-token
        if: steps.detect.outputs.changed == 'true' && env.PUSH_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit and push rustfmt / lock sync fixes
        if: steps.detect.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          COMMIT_MESSAGE: ${{ steps.detect.outputs.commit_message }}
          GH_PAT: ${{ steps.push-token.outputs.token || secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT=/usr/bin/git
          BASE64=/usr/bin/base64
          "$GIT" -c core.hooksPath=/dev/null config user.name "github-actions[bot]"
          "$GIT" -c core.hooksPath=/dev/null config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$GIT" -c core.hooksPath=/dev/null commit -am "$COMMIT_MESSAGE"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | "$BASE64" -w0)"
          "$GIT" -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin "HEAD:$PR_HEAD_REF"
