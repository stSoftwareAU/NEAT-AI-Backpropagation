# Markdown Lint (Issue #44).
#
# `.markdownlint-cli2.yaml` has been committed since Issue #39, but until now
# nothing in CI read it: the structural rules it keeps on (heading hierarchy,
# list indentation, fencing) were advisory, so every hand-written README,
# CHANGELOG and audit note drifted on its own. This job reads that config on
# every pull request and blocks the merge on a violation.
#
# The linter reports; it never rewrites. `--fix` would edit the runner's
# throwaway checkout and exit 0, merging the violation unfixed while the job
# read green — so the run is plain `markdownlint-cli2`, and its non-zero exit
# is the verdict.
#
# markdownlint-cli2 is pinned to an exact version for the same reason the
# actions are pinned to commit SHAs: a hijacked release must not be able to run
# unreviewed code in CI.
#
# The lint gates the pull request only. A `push:` trigger on `Develop` would
# re-run, after the merge, the very run that already gated the pull request —
# a duplicate that spends CI minutes and can leave the default branch showing
# a red tick for a check that already passed (Issue #117). `workflow_dispatch`
# stays so the lint can still be run by hand against any branch.
#
# scripts/check-markdown-lint-workflow.sh enforces the rules above.
name: Markdown Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      - "milestone/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "lts/*"

      - name: Lint Markdown
        run: |
          set -euo pipefail
          # Globs and rule overrides come from .markdownlint-cli2.yaml at the
          # repository root; a violation exits non-zero and blocks the merge.
          npm install --global markdownlint-cli2@0.23.2
          markdownlint-cli2
